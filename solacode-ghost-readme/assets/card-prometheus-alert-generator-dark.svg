<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="208" height="238" viewBox="0 0 208 238" role="img" aria-label="No. 06, Alert Generator project card"><title>No. 06, Alert Generator project card</title><style>.a{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-5px) rotate(-2deg)}to{transform:translateY(6px) rotate(2deg)}}
.blink{animation:blink 7s ease-in-out infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.flick{animation:flick 2.4s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1);opacity:.85}to{transform:scale(.85,1.15);opacity:1}}
.rise{animation:rise 10s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-80px);opacity:0}}
.pulse{animation:pulse 6s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
.kb{animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.dash{animation:dash 8s linear infinite}
@keyframes dash{to{stroke-dashoffset:-72}}
.shim{animation:shim 10s ease-in-out infinite}
@keyframes shim{0%,55%{transform:translateX(-120px)}100%{transform:translateX(420px)}}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.bob,.blink,.flick,.rise,.pulse,.kb,.dash,.shim,.tw{animation:none}}</style><defs><radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8ff0d0" stop-opacity=".32"/><stop offset="1" stop-color="#8ff0d0" stop-opacity="0"/></radialGradient><radialGradient id="cg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ff0d0" stop-opacity=".55"/><stop offset="1" stop-color="#8ff0d0" stop-opacity=".1"/></linearGradient><linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8ff0d0" stop-opacity="0"/><stop offset=".5" stop-color="#8ff0d0" stop-opacity=".3"/><stop offset="1" stop-color="#8ff0d0" stop-opacity="0"/></linearGradient><pattern id="ht" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0,0V5" stroke="#8ff0d0" stroke-width=".8" opacity=".07"/></pattern><pattern id="twp" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><path d="M0,0H9" stroke="#3f9d8d" stroke-width="1.8" opacity=".85"/></pattern><filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .55  0 0 0 0 .5  0 0 0 .5 -.17"/></filter></defs><rect width="208" height="238" fill="#05090c"/><rect width="208" height="238" fill="url(#ht)"/><rect x="1" y="1" width="206" height="236" rx="4" fill="#0b1519" stroke="#3f9d8d" stroke-width="1.4"/><clipPath id="tc"><rect x="8" y="8" width="192" height="92"/></clipPath><g clip-path="url(#tc)"><image class="a kb" x="8" y="8" width="192" height="92" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/jpeg;base64," style="animation-delay:-15s"/><g transform="skewX(-20)"><rect class="a shim" x="20" y="8" width="26" height="92" fill="url(#shg)" style="animation-delay:-6.5s"/></g></g><rect x="8" y="8" width="192" height="92" fill="none" stroke="#8ff0d0" stroke-width=".9"/><rect x="8" y="8" width="58" height="19" fill="#05090c" stroke="#8ff0d0" stroke-width=".9"/><text x="37" y="21" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace" font-size="10.5" font-weight="700" fill="#8ff0d0">No. 06</text><path d="M10,131H198M10,150H198M10,165H198" stroke="#2a4048" stroke-width=".8" opacity=".8"/><text x="10" y="126" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-weight="700" font-size="16" fill="#e6f1ee">Alert Generator</text><text x="10" y="145" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="11.5" fill="#9db5b0">AI generator for Prometheus</text><text x="10" y="160" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="11.5" fill="#9db5b0">alert rules.</text><rect x="8" y="176" width="26.8" height="18" rx="3" fill="#101e24" stroke="#3f9d8d" stroke-width=".8"/><text x="21.4" y="188.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace" font-size="10.5" fill="#e6f1ee">AI</text><rect x="39.8" y="176" width="78" height="18" rx="3" fill="#101e24" stroke="#3f9d8d" stroke-width=".8"/><text x="78.8" y="188.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace" font-size="10.5" fill="#e6f1ee">Prometheus</text><circle cx="104" cy="229" r="3.5" fill="#05090c" stroke="#3f9d8d" stroke-width="1"/><rect class="grain" width="208" height="238" fill="#000" opacity=".5" filter="url(#noise)"/></svg>