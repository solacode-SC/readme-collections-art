<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="About Solayman El Mouden and his journey"><title>About Solayman El Mouden and his journey</title><style>.a{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-5px) rotate(-2deg)}to{transform:translateY(6px) rotate(2deg)}}
.blink{animation:blink 7s ease-in-out infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.flick{animation:flick 2.4s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1);opacity:.85}to{transform:scale(.85,1.15);opacity:1}}
.rise{animation:rise 10s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-80px);opacity:0}}
.pulse{animation:pulse 6s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
.kb{animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.dash{animation:dash 8s linear infinite}
@keyframes dash{to{stroke-dashoffset:-72}}
.shim{animation:shim 10s ease-in-out infinite}
@keyframes shim{0%,55%{transform:translateX(-120px)}100%{transform:translateX(420px)}}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.bob,.blink,.flick,.rise,.pulse,.kb,.dash,.shim,.tw{animation:none}}</style><defs><radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2a8f7e" stop-opacity=".32"/><stop offset="1" stop-color="#2a8f7e" stop-opacity="0"/></radialGradient><radialGradient id="cg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#c98a1a" stop-opacity=".55"/><stop offset="1" stop-color="#c98a1a" stop-opacity="0"/></radialGradient><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".45"/></linearGradient><linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a8f7e" stop-opacity="0"/><stop offset=".5" stop-color="#2a8f7e" stop-opacity=".3"/><stop offset="1" stop-color="#2a8f7e" stop-opacity="0"/></linearGradient><pattern id="ht" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0,0V5" stroke="#1a2326" stroke-width=".8" opacity=".07"/></pattern><pattern id="twp" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><path d="M0,0H9" stroke="#3c7f74" stroke-width="1.8" opacity=".85"/></pattern><filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .55  0 0 0 0 .5  0 0 0 .5 -.17"/></filter></defs><rect width="900" height="330" fill="#efece1"/><rect width="900" height="330" fill="url(#ht)"/><rect x="20" y="14" width="860" height="302" rx="3" fill="#f8f6ee" stroke="#3c7f74" stroke-width="1.6"/><rect x="26" y="20" width="848" height="290" rx="2" fill="none" stroke="#2a8f7e" stroke-width=".7" opacity=".55"/><path d="M24,18h12M24,18v12" stroke="#2a8f7e" stroke-width="2"/><path d="M876,18h-12M876,18v12" stroke="#2a8f7e" stroke-width="2"/><path d="M24,312h12M24,312v-12" stroke="#2a8f7e" stroke-width="2"/><path 