action and turning that knowledge into</text><path d="M56,254H500" stroke="#c9c3ae" stroke-width=".9"/><text x="58" y="246" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="15" fill="#1a2326">useful software.</text><rect x="538" y="98" width="7" height="11" rx="1" fill="none" stroke="#1d6f63" stroke-width="1.3"/><text x="554" y="108" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace" font-size="14" font-weight="700" fill="#1a2326">C / C++</text><path d="M656,103H708" stroke="#2a8f7e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 7" class="dash" style="animation-delay:-0s"/><text x="720" y="108" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="15" fill="#1a2326">Systems</text><rect x="538" y="136" width="7" height="11" rx="1" fill="none" stroke="#1d6f63" stroke-width="1.3"/><text x="554" y="146" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace" font-size="14" font-weight="700" fill="#1a2326">Python</text><path d="M656,141H708" stroke="#2a8f7e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 7" class="dash" style="animation-delay:-1s"/><text x="720" y="146" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="15" fill="#1a2326">Backend &amp; AI</text><rect x="538" y="174" width="7" height="11" rx="1" fill="none" stroke="#1d6f63" stroke-width="1.3"/><text x="554" y="184" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace" font-size="14" font-weight="700" fill="#1a2326">TypeScript</text><path d="M656,179H708" stroke="#2a8f7e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 7" class="dash" style="animation-delay:-2s"/><text x="720" y="184" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="15" fill="#1a2326">Web &amp; Tools</text><rect x="538" y="212" width="7" height="11" rx=