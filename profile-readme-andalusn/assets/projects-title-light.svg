<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 60" width="900" height="60" font-family="Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua','DejaVu Serif',serif"><style>
.rosette{transform-box:fill-box;transform-origin:center;animation:spin 220s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tw{animation:tw 7s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.glow{animation:glow 10s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.05}50%{opacity:.4}}
.sweep{animation:sweep 14s ease-in-out infinite}
@keyframes sweep{0%,50%{transform:translateX(-380px)}100%{transform:translateX(460px)}}
.lamp{animation:lamp 6s ease-in-out infinite}
@keyframes lamp{0%,100%{opacity:.55}50%{opacity:1}}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 10s ease-out infinite;opacity:0}
@keyframes rip{0%{transform:scale(.2);opacity:0}15%{opacity:.7}100%{transform:scale(1.5);opacity:0}}
.pfall{animation:pfall linear infinite}
@keyframes pfall{from{transform:translateY(-30px)}to{transform:translateY(580px)}}
.psway{transform-box:fill-box;transform-origin:center;animation:psway ease-in-out infinite alternate}
@keyframes psway{from{transform:translateX(-26px) rotate(-30deg)}to{transform:translateX(26px) rotate(30deg)}}
.breath{transform-box:fill-box;transform-origin:center;animation:br 24s ease-in-out infinite alternate}
@keyframes br{from{transform:scale(1)}to{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.rosette,.tw,.glow,.sweep,.lamp,.rip,.pfall,.psway,.breath{animation:none}}
</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9eed9"/><stop offset="1" stop-color="#ecd8b6"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a87f1f"/><stop offset=".5" stop-color="#d9b45a"/><stop offset="1" stop-color="#a87f1f"/></linearGradient>
<linearGradient id="shim" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="warm"><stop offset="0" stop-color="#ffd27a" stop-opacity=".95"/><stop offset=".45" stop-color="#ffb347" stop-opacity=".35"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
<radialGradient id="lightg"><stop offset="0" stop-color="#ff9aa8" stop-opacity=".9"/><stop offset="1" stop-color="#ff9aa8" stop-opacity="0"/></radialGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="6"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .25  0 0 0 0 .1  0 0 0 .16 0"/></filter>
<pattern id="zel" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#1b7d86"/>
<g stroke="#d9b45a" stroke-width=".9" stroke-linejoin="round"><polygon points="29.2,29.2 10.8,29.2 10.8,10.8 29.2,10.8" fill="#b3162a"/><polygon points="20,33 7,20 20,7 33,20" fill="#b3162a"/></g>
<circle cx="20" cy="20" r="4" fill="#d9b45a"/>
<g fill="#a87f1f" stroke="#d9b45a" stroke-width=".6"><path d="M0 -5L5 0L0 5L-5 0Z" transform="translate(0 0)"/><path d="M0 -5L5 0L0 5L-5 0Z" transform="translate(40 0)"/><path d="M0 -5L5 0L0 5L-5 0Z" transform="translate(0 40)"/><path d="M0 -5L5 0L0 5L-5 0Z" transform="translate(40 40)"/></g></pattern>
<pattern id="zel2" width="28" height="28" patternUnits="userSpaceOnUse"><g fill="none" stroke="#a87f1f" stroke-opacity=".5" stroke-width=".8"><polygon points="20.4,20.4 7.6,20.4 7.6,7.6 20.4,7.6"/><polygon points="14,23 5,14 14,5 23,14"/><circle cx="14" cy="14" r="2.4"/></g></pattern>
</defs><rect width="900" height="60" fill="url(#bg)"/><rect width="900" height="60" filter="url(#grain)"/><g fill="#b3162a" stroke="#a87f1f" stroke-width="1" stroke-linejoin="round" ><polygon points="84.6,42.6 63.4,42.6 63.4,21.4 84.6,21.4"/><polygon points="74,47 59,32 74,17 89,32"/></g><text x="74" y="38" font-size="15" font-weight="700" text-anchor="middle" fill="#fbf2df" font-family="'Amiri','Noto Naskh Arabic','Scheherazade New','Traditional Arabic','Geeza Pro','Segoe UI',Tahoma,serif">٤</text><text x="100" y="37" font-size="15" font-weight="700" letter-spacing="3" fill="#3a1218">SELECTED PROJECTS</text><path d="M100 48H360" stroke="url(#gold)" stroke-width="1.4"/><g fill="#176f78" stroke="#a87f1f" stroke-width="0.6" stroke-linejoin="round" ><polygon points="368.8,50.8 363.2,50.8 363.2,45.2 368.8,45.2"/><polygon points="366,52 362,48 366,44 370,48"/></g><path d="M.5 0V60M899.5 0V60" stroke="#cdb27a"/></svg>