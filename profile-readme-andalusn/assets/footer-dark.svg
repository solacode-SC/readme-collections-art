<g stroke="#f3dc92" stroke-width=".9" stroke-linejoin="round"><polygon points="29.2,29.2 10.8,29.2 10.8,10.8 29.2,10.8" fill="#e23c52"/><polygon points="20,33 7,20 20,7 33,20" fill="#e23c52"/></g>
<circle cx="20" cy="20" r="4" fill="#f3dc92"/>
<g fill="#dcb85e" stroke="#f3dc92" stroke-width=".6"><path d="M0 -5L5 0L0 5L-5 0Z" transform="translate(0 0)"/><path d="M0 -5L5 0L0 5L-5 0Z" transform="translate(40 0)"/><path d="M0 -5L5 0L0 5L-5 0Z" transform="translate(0 40)"/><path d="M0 -5L5 0L0 5L-5 0Z" transform="translate(40 40)"/></g></pattern>
