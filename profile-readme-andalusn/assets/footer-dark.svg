7.6,187.6 710.4,187.6"/><polygon points="704,203 695,194 704,185 713,194"/></g><circle cx="704" cy="194" r="2.6" fill="#fff3c0"/><rect x="750" y="144" width="36" height="126" fill="url(#zel2)"/><path d="M793.3 262V212.9A44 44 0 1 1 870.7 212.9V262Z" fill="#12060b" stroke="url(#gold)" stroke-width="3.4"/><g class="lamp" style="animation-delay:-5.4s"><circle cx="832" cy="198" r="30" fill="url(#warm)"/></g><path d="M832 150V184" stroke="#dcb85e"/><g fill="#f3dc92" stroke="#dcb85e" stroke-width="0.8" stroke-linejoin="round" ><polygon points="838.4,200.4 825.6,200.4 825.6,187.6 838.4,187.6"/><polygon points="832,203 823,194 832,185 841,194"/></g><circle cx="832" cy="194" r="2.6" fill="#fff3c0"/><rect x="0" y="262" width="900" height="14" fill="#145a62"/><path d="M0 262H900" stroke="url(#gold)" stroke-width="1.6"/><g fill="none" stroke="#fff" stroke-opacity=".7"><ellipse class="rip" cx="220" cy="269" rx="40" ry="3"/><ellipse class="rip" style="animation-delay:-5s" cx="640" cy="269" rx="40" ry="3"/></g><g transform="translate(175.3 0)"><g class="pfall" style="animation-duration:45.6s;animation-delay:-45.2s"><g class="psway" style="animation-duration:8.4s;animation-delay:-4.0s"><path transform="rotate(173) scale(1.01)" d="M0 -7C6 -7 7 3 0 8C-7 3 -6 -7 0 -7Z" fill="#fbd3cc" opacity=".85"/></g></g></g><g transform="translate(190.5 0)"><g class="pfall" style="animation-duration:40.3s;animation-delay:-17.2s"><g class="psway" style="animation-duration:8.7s;animation-delay:-1.3s"><path transform="rotate(135) scale(0.94)" d="M0 -7C6 -7 7 3 0 8C-7 3 -6 -7 0 -7Z" fill="#f1a3b2" opacity=".85"/></g></g></g><g transform="translate(795.6 0)"><g class="pfall" style="animation-duration:60.0s;animation-delay:-52.5s"><g class="psway" style="animation-duration:8.0s;animation-delay:-4.9s"><path transform="rotate(6) scale(1.01)" d="M0 -7C6 -7 7 3 0 8C-7 3 -6 -7 0 -7Z" fill="#e8798f" opacity=".85"/></g></g></g><g transform="translate(309.7 0)"><g class="pfall" style="animation-duration:53.0s;an