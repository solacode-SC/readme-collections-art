<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 40" width="150" height="40" font-family="Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua','DejaVu Serif',serif"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e9cd"/><stop offset="1" stop-color="#e4d4a9"/></linearGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".65" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#b9a77a" stop-opacity=".28"/></radialGradient>
<radialGradient id="sunglow"><stop offset="0" stop-color="#ff6a4a" stop-opacity=".9"/><stop offset="1" stop-color="#ff6a4a" stop-opacity="0"/></radialGradient>
<filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".012 .4" numOctaves="3" seed="5"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .15  0 0 0 .5 0"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .22  0 0 0 0 .1  0 0 0 .13 0"/></filter>
<filter id="rough" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="7" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="3.4" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="wob" x="-4%" y="-20%" width="108%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="2" seed="3" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="1.6" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="paint" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="2" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="2.6" xChannelSelector="R" yChannelSelector="G" result="d"/><feColorMatrix in="d" type="saturate" values=".9"/></filter>
<pattern id="sei" width="24" height="12" patternUnits="userSpaceOnUse"><g fill="none" stroke="#8ea5b2" stroke-width=".8"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="4"/><circle cx="0" cy="6" r="10"/><circle cx="0" cy="6" r="7"/><circle cx="0" cy="6" r="4"/><circle cx="24" cy="6" r="10"/><circle cx="24" cy="6" r="7"/><circle cx="24" cy="6" r="4"/></g></pattern>
</defs><rect x="2" y="2" width="146" height="36" fill="#f8f0d6" stroke="#23201c" stroke-width="1.4" filter="url(#wob)"/><rect x="8" y="9" width="22" height="22" fill="#bf2a22" filter="url(#rough)"/><text x="19" y="25.5" font-size="14" font-family="'KaiTi','STKaiti','Kaiti SC','AR PL UKai CN','Noto Serif SC','Songti SC','SimSun',serif" font-weight="700" text-anchor="middle" fill="#f6edd2">链</text><text x="40" y="24.5" font-size="12" letter-spacing="2" fill="#26211b">LINKEDIN</text></svg>