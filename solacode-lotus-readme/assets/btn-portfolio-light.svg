<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="150" height="40" viewBox="0 0 150 40" role="img" aria-label="Portfolio"><title>Portfolio</title><style>.a{transform-box:fill-box;transform-origin:center}
.sway{animation:sway 9s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.swim{animation:swim 15s ease-in-out infinite alternate}
@keyframes swim{from{transform:translate(0,0)}to{transform:translate(40px,-5px)}}
.rip{opacity:.3;animation:rip 8s ease-out infinite}
@keyframes rip{0%{transform:scale(.2);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.kb{animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.dash{animation:dash 7s linear infinite}
@keyframes dash{to{stroke-dashoffset:-60}}
.shim{animation:shim 9s ease-in-out infinite}
@keyframes shim{0%,55%{transform:translateX(-120px)}100%{transform:translateX(420px)}}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.sway,.swim,.rip,.kb,.dash,.shim,.tw{animation:none}}</style><defs><radialGradient id="lg" cx=".4" cy=".38" r=".8"><stop offset="0" stop-color="#1e8d95"/><stop offset=".55" stop-color="#1c7c8a"/><stop offset="1" stop-color="#0f5566"/></radialGradient><linearGradient id="pt" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fffaf0"/><stop offset=".6" stop-color="#fffaf0"/><stop offset="1" stop-color="#2f9aa0"/></linearGradient><linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a2711f" stop-opacity="0"/><stop offset=".5" stop-color="#a2711f" stop-opacity=".38"/><stop offset="1" stop-color="#a2711f" stop-opacity="0"/></linearGradient><filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .55 -.18"/></filter></defs><rect x="1" y="1" width="148" height="38" rx="19" fill="#fbf4e1" stroke="#a2711f" stroke-width="1.4"/><g transform="translate(22,20) scale(1)"><g class="a sway" style="animation-delay:0s"><path d="M10.2,0 L10,1.3 L9.7,2.6 L9.3,3.9 L8.7,5 L7.8,6 L6.7,6.7 L5.6,7.3 L4.6,8 L3.7,8.9 L2.6,9.7 L1.3,10.2 L0,10.4 L-1.3,10.2 L-2.6,9.8 L-3.9,9.5 L-5.2,9 L-6.4,8.4 L-7.4,7.4 L-8,6.2 L-8.4,4.8 L-8.6,3.6 L-9,2.4 L-9.4,1.2 L-9.8,0 L-9.9,-1.3 L-9.6,-2.6 L-9.1,-3.8 L-8.6,-5 L-8.1,-6.2 L-7.4,-7.4 L-6.6,-8.5 L-5.4,-9.3 L-4,-9.6 L-2.6,-9.6 L-1.3,-9.6 L-0,-9.6 L1.3,-9.6 L2.5,-9.5 L3.7,-9 L4.8,-8.3 L5.8,-7.5 L6.7,-6.7 L7.8,-6 L9,-5.2 L9.9,-4.1 L10.3,-2.8 L10.4,-1.4Z" fill="url(#lg)" stroke="#a2711f" stroke-width="1" stroke-opacity=".8"/><path d="M0,0Q5,0.4 9.4,-0.3 M0,0Q3,4 6.5,6.7 M0,0Q-0.4,5 0.4,9.4 M0,0Q-3.9,3.1 -6.7,6.6 M0,0Q-5,-0.5 -9.4,0.1 M0,0Q-3.3,-3.8 -6.9,-6.3 M0,0Q0.6,-5 0,-9.4 M0,0Q3.8,-3.3 6.3,-6.9" fill="none" stroke="#a2711f" stroke-width=".8" stroke-opacity=".85" stroke-linecap="round"/><circle r="5.5" fill="none" stroke="#a2711f" stroke-width=".6" stroke-dasharray="1 4" opacity=".5"/><circle r="1.5" fill="#a2711f"/></g></g><text x="42" y="25" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#13303a">PORTFOLIO</text><rect class="grain" width="150" height="40" fill="#000" opacity=".5" filter="url(#noise)"/></svg>