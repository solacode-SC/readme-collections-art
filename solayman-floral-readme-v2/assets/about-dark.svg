</text><text x="62" y="195" font-size="13" fill="#F7EBCB">the abstraction and turning that knowledge</text><text x="62" y="216" font-size="13" fill="#F7EBCB">into useful software.</text><rect x="525" y="74" width="1" height="178" fill="#557CC1"/><text x="560" y="94" font-size="20" font-weight="700" font-family="'Cormorant Garamond','Playfair Display',Georgia,'Times New Roman',serif" fill="#F7EBCB">What I build</text><circle cx="574" cy="121" r="5" fill="none" stroke="#F1CD72"/><text x="594" y="126" font-size="13" fill="#F7EBCB">C / C++</text><text x="710" y="126" font-size="13" fill="#F1CD72">→</text><text x="748" y="126" font-size="13" fill="#C7D4EC">Systems</text><circle cx="574" cy="148" r="5" fill="none" stroke="#F1CD72"/><text x="594" y="153" font-size="13" fill="#F7EBCB">Python</text><text x="710" y="153" font-size="13" fill="#F1CD72">→</text><text x="748" y="153" font-size="13" fill="#C7D4EC">Backend &amp; AI</text><circle cx="574" cy="175" r="5" fill="none" stroke="#F1CD72"/><text x="594" y="180" font-size="13" fill="#F7EBCB">TypeScript</text><text x="710" y="180" font-size="13" fill="#F1CD72">→</text><text x="748" y="180" font-size="13" fill="#C7D4EC">Web &amp; Tools</text><circle cx="574" cy="202" r="5" fill="none" stroke="#F1CD72"/><text x="594" y="207" font-size="13" fill="#F7EBCB">Docker</text><text x="710" y="207" font-size="13" fill="#F1CD72">→</text><text x="748" y="207" font-size="13" fill="#C7D4EC">Infrastructure</text><circle cx="574" cy="229" r="5" fill="none" stroke="#F1CD72"/><text x="594" y="234" font-size="13" fill="#F7EBCB">Linux</text><text x="710" y="234" font-size="13" fill="#F1CD72">→</text><text x="748" y="234" font-size="13" fill="#C7D4EC">DevOps</text><ellipse cx="980" cy="113.7" rx="10.9" ry="19.0" transform="rotate(0.0 980 130)" fill="#F1CD72" fill-opacity="0.35" stroke="#D8A63A" stroke-width=".7"/><ellipse cx="980" cy="113.7" rx="10.9" ry="19.0" transform="rotate(40.0 980 130)" fill="#F1CD72" fill-opacity="0.35" stroke="#D8A63A" st