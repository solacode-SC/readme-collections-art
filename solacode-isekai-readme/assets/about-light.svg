<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="About Solayman El Mouden and his journey"><title>About Solayman El Mouden and his journey</title><style>.a{transform-box:fill-box;transform-origin:center}
.spin{animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spinr{animation:spin 110s linear infinite reverse}
.swim{animation:swim 18s ease-in-out infinite alternate}
@keyframes swim{from{transform:translateX(0)}to{transform:translateX(34px)}}
.flag{transform-origin:left center;animation:flag 3.2s ease-in-out infinite alternate}
@keyframes flag{from{transform:skewY(-6deg) scaleX(1)}to{transform:skewY(6deg) scaleX(.9)}}
.rise{animation:rise 9s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.95}100%{transform:translateY(-70px);opacity:0}}
.pulse{animation:pulse 6s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.kb{animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.dash{animation:dash 7s linear infinite}
@keyframes dash{to{stroke-dashoffset:-60}}
.shim{animation:shim 9s ease-in-out infinite}
@keyframes shim{0%,55%{transform:translateX(-120px)}100%{transform:translateX(420px)}}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.spin,.spinr,.swim,.flag,.rise,.pulse,.kb,.dash,.shim,.tw{animation:none}}</style><defs><radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2b6fb0" stop-opacity=".42"/><stop offset="1" stop-color="#2b6fb0" stop-opacity="0"/></radialGradient><linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b3822a" stop-opacity="0"/><stop offset=".5" stop-color="#b3822a" stop-opacity=".38"/><stop offset="1" stop-color="#b3822a" stop-opacity="0"/></linearGradient><filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .4  0 0 0 0 .5  0 0 0 .5 -.16"/></filter></defs><rect width="900" height="330" fill="#efe5ca"/><path d="M34,14H866L880,28V302L866,316H34L20,302V28Z" fill="#f8f1de" stroke="#b3822a" stroke-width="1.8"/><path d="M40,20H860L874,34V296L860,310H40L26,296V34Z" fill="none" stroke="#b3822a" stroke-width=".8" opacity=".6"/><g transform="translate(30,24) scale(1,1)" fill="none" stroke="#b3822a" stroke-width="1.2"><path d="M6,6C26,6 30,18 20,24C12,28 8,20 14,16"/><path d="M6,6C6,26 18,30 24,20C28,12 20,8 16,14"/><circle cx="6" cy="6" r="2.2" fill="#b3822a"/></g><g transform="translate(870,24) scale(-1,1)" fill="none" stroke="#b3822a" stroke-width="1.2"><path d="M6,6C26,6 30,18 20,24C12,28 8,20 14,16"/><path d="M6,6C6,26 18,30 24,20C28,12 20,8 16,14"/><circle cx="6" cy="6" r="2.2" fill="#b3822a"/></g><g transform="translate(30,306) scale(1,-1)" fill="none" stroke="#b3822a" stroke-width="1.2"><path d="M6,6C26,6 30,18 20,24C12,28 8,20 14,16"/><path d="M6,6C6,26 18,30 24,20C28,12 20,8 16,14"/><circle cx="6" cy="6" r="2.2" fill="#b3822a"/></g><g transform="translate(870,306) scale(-1,-1)" fill="none" stroke="#b3822a" stroke-width="1.2"><path d="M6,6C26,6 30,18 20,24C12,28 8,20 14,16"/><path d="M6,6C6,26 18,30 24,20C28,12 20,8 16,14"/><circle cx="6" cy="6" r="2.2" fill="#b3822a"/></g><path transform="translate(62,53) scale(1.1666666666666667)" d="M0,-8L2,-2L8,0L2,2L0,8L-2,2L-8,0L-2,-2Z" fill="#b3822a"/><text x="76" y="58" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace" font-size="12.5" letter-spacing="3" fill="#7d5a12" font-weight="700">I  ·  ABOUT</text><path transform="translate(542,53) scale(1.1666666666666667)" d="M0,-8L2,-2L8,0L2,2L0,8L-2,2L-8,0L-2,-2Z" fill="#b3822a"/><text x="556" y="58" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace" font-size="12.5" letter-spacing="3" fill="#7d5a12" font-weight="700">II  ·  MY JOURNEY</text><text x="58" y="106" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="15" fill="#1b2457">I'm Solayman El Mouden, a software engineer</text><text x="58" y="134" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="15" fill="#1b2457">focused on systems, web technologies,</text><text x="58" y="162" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="15" fill="#1b2457">artificial intelligence and mathematics.</text><text x="58" y="190" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="15" fill="#1b2457">I enjoy understanding how things work underneath</text><text x="58" y="218" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="15" fill="#1b2457">the abstraction and turning that knowledge into</text><text x="58" y="246" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="15" fill="#1b2457">useful software.</text><path transform="translate(540,103) scale(1.0)" d="M0,-8L2,-2L8,0L2,2L0,8L-2,2L-8,0L-2,-2Z" fill="#b3822a"/><text x="554" y="108" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace" font-size="14" font-weight="700" fill="#1b2457">C / C++</text><path d="M656,103H708" stroke="#b3822a" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1 7" class="dash" style="animation-delay:-0s"/><text x="720" y="108" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="15" fill="#1b2457">Systems</text><path transform="translate(540,141) scale(1.0)" d="M0,-8L2,-2L8,0L2,2L0,8L-2,2L-8,0L-2,-2Z" fill="#b3822a"/><text x="554" y="146" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace" font-size="14" font-weight="700" fill="#1b2457">Python</text><path d="M656,141H708" stroke="#b3822a" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1 7" class="dash" style="animation-delay:-1s"/><text x="720" y="146" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="15" fill="#1b2457">Backend &amp; AI</text><path transform="translate(540,179) scale(1.0)" d="M0,-8L2,-2L8,0L2,2L0,8L-2,2L-8,0L-2,-2Z" fill="#b3822a"/><text x="554" y="184" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace" font-size="14" font-weight="700" fill="#1b2457">TypeScript</text><path d="M656,179H708" stroke="#b3822a" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1 7" class="dash" style="animation-delay:-2s"/><text x="720" y="184" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="15" fill="#1b2457">Web &amp; Tools</text><path transform="translate(540,217) scale(1.0)" d="M0,-8L2,-2L8,0L2,2L0,8L-2,2L-8,0L-2,-2Z" fill="#b3822a"/><text x="554" y="222" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace" font-size="14" font-weight="700" fill="#1b2457">Docker</text><path d="M656,217H708" stroke="#b3822a" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1 7" class="dash" style="animation-delay:-3s"/><text x="720" y="222" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="15" fill="#1b2457">Infrastructure</text><p