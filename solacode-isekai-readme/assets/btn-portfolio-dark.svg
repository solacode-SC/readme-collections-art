<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="150" height="40" viewBox="0 0 150 40" role="img" aria-label="Portfolio"><title>Portfolio</title><style>.a{transform-box:fill-box;transform-origin:center}
.spin{animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spinr{animation:spin 110s linear infinite reverse}
.swim{animation:swim 18s ease-in-out infinite alternate}
@keyframes swim{from{transform:translateX(0)}to{transform:translateX(34px)}}
.flag{transform-origin:left center;animation:flag 3.2s ease-in-out infinite alternate}
@keyframes flag{from{transform:skewY(-6deg) scaleX(1)}to{transform:skewY(6deg) scaleX(.9)}}
.rise{animation:rise 9s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.95}100%{transform:translateY(-70px);opacity:0}}
.pulse{animation:pulse 6s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.kb{animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.dash{animation:dash 7s linear infinite}
@keyframes dash{to{stroke-dashoffset:-60}}
.shim{animation:shim 9s ease-in-out infinite}
@keyframes shim{0%,55%{transform:translateX(-120px)}100%{transform:translateX(420px)}}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.spin,.spinr,.swim,.flag,.rise,.pulse,.kb,.dash,.shim,.tw{animation:none}}</style><defs><radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8fd3ff" stop-opacity=".42"/><stop offset="1" stop-color="#8fd3ff" stop-opacity="0"/></radialGradient><linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f0c25a" stop-opacity="0"/><stop offset=".5" stop-color="#f0c25a" stop-opacity=".38"/><stop offset="1" stop-color="#f0c25a" stop-opacity="0"/></linearGradient><filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .4  0 0 0 0 .5  0 0 0 .5 -.16"/></filter></defs><path d="M12,1H138L149,12V28L138,39H12L1,28V12Z" fill="#141d4d" stroke="#f0c25a" stroke-width="1.4"/><path transform="translate(22,20) scale(1.3333333333333333)" d="M0,-8L2,-2L8,0L2,2L0,8L-2,2L-8,0L-2,-2Z" fill="#f0c25a"/><text x="38" y="25" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#eef0fa">PORTFOLIO</text><rect class="grain" width="150" height="40" fill="#000" opacity=".5" filter="url(#noise)"/></svg>