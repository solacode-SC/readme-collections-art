<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="332" viewBox="0 0 900 332" role="img" aria-label="About and journey"><title>About and journey</title><desc>About text on the left; on the right the journey from languages to areas: C / C++ to Systems, Python to Backend &amp; AI, TypeScript to Web &amp; Tools, Docker to Infrastructure, Linux to DevOps.</desc><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E1028"/><stop offset="1" stop-color="#4A1F45"/></linearGradient><pattern id="ad" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#FCE9C9"/></pattern></defs><style>
.a{animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.drift{animation-name:drift;animation-duration:24s}
.bob{transform-box:fill-box;transform-origin:center;animation-name:bob;animation-duration:6s}
.kb{transform-box:fill-box;transform-origin:50% 38%;animation-name:kb;animation-duration:26s}
.glint{transform-box:fill-box;transform-origin:center;animation-name:glint;animation-duration:3.6s}
.pulse{transform-box:fill-box;transform-origin:center;animation-name:pulse;animation-duration:6s}
.flow{animation-name:flow;animation-duration:3s;animation-timing-function:linear;animation-direction:normal}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(26px)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes glint{0%{opacity:.25;transform:scale(.5)}60%{opacity:1;transform:scale(1.1)}100%{opacity:.35;transform:scale(.6)}}
@keyframes pulse{from{opacity:.8;transform:scale(1)}to{opacity:1;transform:scale(1.05)}}
@keyframes flow{to{stroke-dashoffset:-48}}
@media (prefers-reduced-motion: reduce){.a{animation:none}}
</style><rect width="900" height="332" fill="url(#ag)"/><rect width="900" height="332" fill="url(#ad)" opacity=".07"/><rect x="21" y="21" width="868" height="302" rx="22" fill="#0E0614"/><rect x="14" y="14" width="868" height="302" rx="22" fill="#2B1738" stroke="#FCE9C9" stroke-width="2.4"/><g stroke="#FCE9C9" stroke-width="1.6" stroke-linecap="round"><line x1="70.0" y1="58.0" x2="74.0" y2="58.0"/><line x1="67.1" y1="65.1" x2="69.9" y2="67.9"/><line x1="60.0" y1="68.0" x2="60.0" y2="72.0"/><line x1="52.9" y1="65.1" x2="50.1" y2="67.9"/><line x1="50.0" y1="58.0" x2="46.0" y2="58.0"/><line x1="52.9" y1="50.9" x2="50.1" y2="48.1"/><line x1="60.0" y1="48.0" x2="60.0" y2="44.0"/><line x1="67.1" y1="50.9" x2="69.9" y2="48.1"/></g><circle cx="60" cy="58" r="7" fill="#F7C95A" stroke="#FCE9C9" stroke-width="1.8"/><circle cx="60" cy="58" r="3.5" fill="none" stroke="#FCE9C9" stroke-width="1"/><text x="82" y="66" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="24" font-weight="700" font-style="italic" fill="#FCE9C9">About</text><g stroke="#FCE9C9" stroke-width="1.6" stroke-linecap="round"><line x1="546.0" y1="58.0" x2="550.0" y2="58.0"/><line x1="543.1" y1="65.1" x2="545.9" y2="67.9"/><line x1="536.0" y1="68.0" x2="536.0" y2="72.0"/><line x1="528.9" y1="65.1" x2="526.1" y2="67.9"/><line x1="526.0" y1="58.0" x2="522.0" y2="58.0"/><line x1="528.9" y1="50.9" x2="526.1" y2="48.1"/><line x1="536.0" y1="48.0" x2="536.0" y2="44.0"/><line x1="543.1" y1="50.9" x2="545.9" y2="48.1"/></g><circle cx="536" cy="58" r="7" fill="#F7C95A" stroke="#FCE9C9" stroke-width="1.8"/><circle cx="536" cy="58" r="3.5" fill="none" stroke="#FCE9C9" stroke-width="1"/><text x="558" y="66" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="24" font-weight="700" font-style="italic" fill="#FCE9C9">My journey</text><text x="52" y="104" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="14.5" fill="#FCE9C9">I'm Solayman El Mouden, a software engineer focused</text><text x="52" y="128" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="14.5" fill="#FCE9C9">on systems, web technologies, artificial</text><text x="52" y="152" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="14.5" fill="#FCE9C9">intelligence and mathematics. I enjoy understanding</text><text x="52" y="176" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="14.5" fill="#FCE9C9">how things work underneath the abstraction and</text><text x="52" y="200" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="14.5" fill="#FCE9C9">turning that knowledge into useful software.</text><text x="52" y="246" font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif" font-size="12" fill="#DCC3D2">Software engineering student at 1337 School (UM6P, 42</text><text x="52" y="264" font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif" font-size="12" fill="#DCC3D2">Network); earlier CPGE (Mathematics and Physics track).</text><text x="52" y="282" font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif" font-size="12" fill="#DCC3D2">Based in Morocco.</text><text x="52" y="308" font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif" font-size="12.5" font-weight="700" fill="#F7C95A">Focus: AI Fullstack, Backend / DevOps</text><path d="M496.0,44.0 L498.2,52.0 L499.0,60.0 L497.8,68.0 L495.4,76.0 L493.4,84.0 L493.1,92.0 L494.8,100.0 L497.2,108.0 L498.9,116.0 L498.6,124.0 L496.6,132.0 L494.2,140.0 L493.0,148.0 L493.8,156.0 L496.0,164.0 L498.2,172.0 L499.0,180.0 L497.8,188.0 L495.4,196.0 L493.4,204.0 L493.1,212.0 L494.8,220.0 L497.2,228.0 L498.9,236.0 L498.6,244.0 L496.6,252.0 L494.2,260.0 L493.0,268.0 L493.8,276.0 L496.0,284.0" fill="none" stroke="#F0735F" stroke-width="1.8" opacity=".8"/><text x="530" y="118" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="18" font-weight="700" fill="#FCE9C9">C / C++</text><line class="flow a" x1="618" y1="113" x2="779" y2="113" stroke="#F0735F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 10"/><text x="850" y="118" text-anchor="end" font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif" font-size="13.5" font-weight="700" fill="#F7C95A">Systems</text><text x="530" y="162" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="18" font-weight="700" fill="#FCE9C9">Python</text><line class="flow a" x1="607" y1="157" x2="741" y2="157" stroke="#F0735F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 10"/><text x="850" y="162" text-anchor="end" font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif" font-size="13.5" font-weight="700" fill="#F7C95A">Backend &amp; AI</text><text x="530" y="206" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="18" font-weight="700" fill="#FCE9C9">TypeScript</text><line class="flow a" x1="650" y1="201" x2="748" y2="201" stroke="#F0735F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 10"/><text x="850" y="206" text-anchor="end" font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif" font-size="13.5" font-weight="700" fill="#F7C95A">Web &amp; Tools</text><text x="530" y="250" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="18" font-weight="700" fill="#FCE9C9">Docker</text><line class="flow a" x1="607" y1="245" x2="726" y2="245" stroke="#F0735F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 10"/><text x="850" y="250" text-anchor="end" font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif" font-size="13.5" font-weight="700" fill="#F7C95A">Infrastructure</text><text x="530" y="294" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="18" font-weight="700" fill="#FCE9C9">Linux</text><line class="flow a" x1="596" y1="289" x2="786" y2="289" stroke="#F0735F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 10"/><text x="850" y="294" text-anchor="end" font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif" font-size="13.5" font-weight="700" fill="#F7C95A">DevOps</text></svg>