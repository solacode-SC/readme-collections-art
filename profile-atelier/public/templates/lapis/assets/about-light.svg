ing student at 1337 School (UM6P, 42</text><text x="52" y="270" font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif" font-size="12" fill="#4A5088">Network); earlier CPGE (Mathematics and Physics track).</text><text x="52" y="288" font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif" font-size="12" fill="#4A5088">Based in Morocco.</text><text x="52" y="314" font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif" font-size="12.5" font-weight="700" fill="#7A5A12">Focus: AI Fullstack, Backend / DevOps</text><path d="M498.0,50.0 L499.5,56.0 L500.6,62.0 L501.0,68.0 L500.5,74.0 L499.3,80.0 L497.7,86.0 L496.2,92.0 L495.2,98.0 L495.0,104.0 L495.7,110.0 L496.9,116.0 L498.5,122.0 L500.0,128.0 L500.9,134.0 L500.9,140.0 L500.2,146.0 L498.8,152.0 L497.2,158.0 L495.8,164.0 L495.1,170.0 L495.1,176.0 L496.0,182.0 L497.5,188.0 L499.1,194.0 L500.3,200.0 L501.0,206.0 L500.8,212.0 L499.8,218.0 L498.3,224.0 L496.7,230.0 L495.5,236.0 L495.0,242.0 L495.4,248.0 L496.5,254.0 L498.0,260.0 L499.5,266.0 L500.6,272.0 L501.0,278.0 L500.5,284.0 L499.3,290.0 L497.7,296.0" fill="none" stroke="#BE9435" stroke-width="1.6"/><g fill="#BE9435"><circle cx="501.9" cy="173.0" r="3.1"/><circle cx="500.0" cy="176.4" r="3.1"/><circle cx="496.0" cy="176.4" r="3.1"/><circle cx="494.1" cy="173.0" r="3.1"/><circle cx="496.0" cy="169.6" r="3.1"/><circle cx="500.0" cy="169.6" r="3.1"/></g><circle cx="498" cy="173" r="2.1" fill="#FCF8EE"/><circle cx="498" cy="173" r="1.0" fill="#BE9435"/><text x="530" y="124" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="18" fill="#161C5A">C / C++</text><line class="flow a" x1="616" y1="119" x2="765" y2="119" stroke="#BE9435" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 10"/><path d="M773,115.5 L776.5,119 L773,122.5 L769.5,119 Z" fill="#BE9435"/><text x="850" y="124" text-anchor="end" font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif" font-size=