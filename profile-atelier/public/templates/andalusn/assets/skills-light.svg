.lamp{animation:lamp 6s ease-in-out infinite}
@keyframes lamp{0%,100%{opacity:.55}50%{opacity:1}}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 10s ease-out infinite;opacity:0}
