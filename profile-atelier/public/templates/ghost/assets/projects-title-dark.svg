<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="80" viewBox="0 0 900 80" role="img" aria-label="Selected projects"><title>Selected projects</title><style>.a{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-5px) rotate(-2deg)}to{transform:translateY(6px) rotate(2deg)}}
.blink{animation:blink 7s ease-in-out infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.flick{animation:flick 2.4s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1);opacity:.85}to{transform:scale(.85,1.15);opacity:1}}
.rise{animation:rise 10s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-80px);opacity:0}}
.pulse{animation:pulse 6s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
.kb{animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.dash{animation:dash 8s linear infinite}
@keyframes dash{to{stroke-dashoffset:-72}}
.shim{animation:shim 10s ease-in-out infinite}
@keyframes shim{0%,55%{transform:translateX(-120px)}100%{transform:translateX(420px)}}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.bob,.blink,.flick,.rise,.pulse,.kb,.dash,.shim,.tw{animation:none}}</style><defs><radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8ff0d0" stop-opacity=".32"/><stop offset="1" stop-color="#8ff0d0" stop-opacity="0"/></radialGradient><radialGradient id="cg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ff0d0" stop-opacity=".55"/><stop offset="1" stop-color="#8ff0d0" stop-opacity=".1"/></linearGradient><linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8ff0d0" stop-opacity="0"/><stop offset=".5" stop-color="#8ff0d0" stop-opacity=".3"/><stop offset="1" stop-color="#8ff0d0" stop-opacity="0"/></linearGradient><pattern id="ht" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0,0V5" stroke="#8ff0d0" stroke-width=".8" opacity=".07"/></pattern><pattern id="twp" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><path d="M0,0H9" stroke="#3f9d8d" stroke-width="1.8" opacity=".85"/></pattern><filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .55  0 0 0 0 .5  0 0 0 .5 -.17"/></filter></defs><rect width="900" height="80" fill="#05090c"/><rect width="900" height="80" fill="url(#ht)"/><path d="M40,42V32H52V40H44V36H48M56,42V32H68V40H60V36H64M72,42V32H84V40H76V36H80M88,42V32H100V40H92V36H96M104,42V32H116V40H108V36H112M120,42V32H132V40H124V36H128M136,42V32H148V40H140V36H144M152,42V32H164V40H156V36H160M168,42V32H180V40H172V36H176M184,42V32H196V40H188V36H192M200,42V32H212V40H204V36H208M216,42V32H228V40H220V36H224M232,42V32H244V40H236V36H240M248,42V32H260V40H252V36H256" fill="none" stroke="#3f9d8d" stroke-width="1.2" opacity="0.9" stroke-linejoin="miter"/><path d="M40,43H270" stroke="#8ff0d0" stroke-width="1.6" stroke-dasharray="2 10" stroke-linecap="round" class="dash" style="animation-delay:0s" opacity=".85"/><path d="M630,42V32H642V40H634V36H638M646,42V32H658V40H650V36H654M662,42V32H674V40H666V36H670M678,42V32H690V40H682V36H686M694,42V32H706V40H698V36H702M710,42V32H722V40H714V36H718M726,42V32H738V40H730V36H734M742,42V32H754V40H746V36H750M758,42V32H770V40H762V36H766M774,42V32H786V40H778V36H782M790,42V32H802V40H794V36H798M806,42V32H818V40H810V36H814M822,42V32H834V40H826V36H830M838,42V32H850V40H842V36H846" fill="none" stroke="#3f9d8d" stroke-width="1.2" opacity="0.9" stroke-linejoin="miter"/><path d="M630,43H860" stroke="#8ff0d0" stroke-width="1.6" stroke-dasharray="2 10" stroke-linecap="round" class="dash" style="animation-delay:-3s" opacity=".85"/><rect x="286" y="14" width="328" height="42" rx="3" fill="#0b1519" stroke="#3f9d8d" stroke-width="1.6"/><rect x="291" y="19" width="318" height="32" rx="2" fill="none" stroke="#8ff0d0" stroke-width=".6" opacity=".6"/><text x="450" y="40" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace" font-size="12.5" font-weight="700" letter-spacing="3" fill="#8ff0d0">SHELF 04  /  SELECTED PROJECTS</text><circle cx="450" cy="66" r="3" fill="#8ff0d0"/><rect class="grain" width="900" height="80" fill="#000" opacity=".5" filter="url(#noise)"/></svg>