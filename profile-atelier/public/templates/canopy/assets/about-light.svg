Vu Serif',serif" font-size="14.5" fill="#1B2D19">software.</text><text x="60" y="290" font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif" font-size="12" fill="#47603F">Software engineering student at 1337 School (UM6P, 42</text><text x="60" y="308" font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif" font-size="12" fill="#47603F">Network); earlier CPGE (Mathematics and Physics track).</text><text x="60" y="326" font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif" font-size="12" fill="#47603F">Based in Morocco.</text><text x="60" y="352" font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif" font-size="12.5" font-weight="700" fill="#3C6A1B">Focus: AI Fullstack, Backend / DevOps</text></g><text x="520" y="134" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="18" font-style="italic" fill="#1B2D19">C / C++</text><path class="flow a" d="M607.0,129.0 L613.0,131.1 L619.0,132.0 L625.0,131.3 L631.0,129.4 L637.0,127.2 L643.0,126.1 L649.0,126.5 L655.0,128.3 L661.0,130.4 L667.0,131.9 L673.0,131.7 L679.0,130.1 L685.0,127.9 L691.0,126.3 L697.0,126.1 L703.0,127.6 L709.0,129.7 L715.0,131.5 L721.0,131.9 L727.0,130.8 L733.0,128.6 L739.0,126.7 L745.0,126.0 L751.0,126.9 L757.0,129.0 L763.0,131.1" fill="none" stroke="#6E9A2C" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 8"/><text x="850" y="134" text-anchor="end" font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif" font-size="13.5" font-weight="700" fill="#3C6A1B">Systems</text><text x="529" y="178" font-family="Georgia,'Iowan Old Style','Palatino Linotype','DejaVu Serif',serif" font-size="18" font-style="italic" fill="#1B2D19">Python</text><path class="flow a" d="M605.0,175.5 L611.0,175.9 L617.0,174.8 L623.0,172.6 L629.0,170.7 L635.0,170.0 L641.0,170.9 L647.0,173.0 L653.0,175.0 L659.0,176.0 L665.0,175.3 L671.0,173.4 L677.0,171.2 L683.0,170.1 L689.0,170.5 L695.0,172.2 L701.0,174.4 L