<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="392" viewBox="0 0 900 392" role="img" aria-label="About and journey"><title>About and journey</title><desc>About text on the left; on the right the journey: C / C++ to Systems, Python to Backend &amp; AI, TypeScript to Web &amp; Tools, Docker to Infrastructure, Linux to DevOps.</desc><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F6E0"/><stop offset="1" stop-color="#DCE8BE"/></linearGradient></defs><style>
