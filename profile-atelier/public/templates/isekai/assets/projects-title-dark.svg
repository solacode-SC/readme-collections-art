<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="90" viewBox="0 0 900 90" role="img" aria-label="Selected projects"><title>Selected projects</title><style>.a{transform-box:fill-box;transform-origin:center}
.spin{animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spinr{animation:spin 110s linear infinite reverse}
.swim{animation:swim 18s ease-in-out infinite alternate}
@keyframes swim{from{transform:translateX(0)}to{transform:translateX(34px)}}
.flag{transform-origin:left center;animation:flag 3.2s ease-in-out infinite alternate}
@keyframes flag{from{transform:skewY(-6deg) scaleX(1)}to{transform:skewY(6deg) scaleX(.9)}}
.rise{animation:rise 9s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.95}100%{transform:translateY(-70px);opacity:0}}
.pulse{animation:pulse 6s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.kb{animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.dash{animation:dash 7s linear infinite}
@keyframes dash{to{stroke-dashoffset:-60}}
.shim{animation:shim 9s ease-in-out infinite}
@keyframes shim{0%,55%{transform:translateX(-120px)}100%{transform:translateX(420px)}}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.spin,.spinr,.swim,.flag,.rise,.pulse,.kb,.dash,.shim,.tw{animation:none}}</style><defs><radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8fd3ff" stop-opacity=".42"/><stop offset="1" stop-color="#8fd3ff" stop-opacity="0"/></radialGradient><linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f0c25a" stop-opacity="0"/><stop offset=".5" stop-color="#f0c25a" stop-opacity=".38"/><stop offset="1" stop-color="#f0c25a" stop-opacity="0"/></linearGradient><filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .4  0 0 0 0 .5  0 0 0 .5 -.16"/></filter></defs><rect width="900" height="90" fill="#0b1030"/><path d="M40,36.2 L50,36.4 L60,36.4 L70,36.1 L80,35.7 L90,35.1 L100,34.5 L110,33.8 L120,33.1 L130,32.5 L140,32 L150,31.7 L160,31.6 L170,31.7 L180,32 L190,32.5 L200,33.1 L210,33.7 L220,34.4 L230,35.1 L240,35.7 L250,36.1 L260,36.3 L270,36.4 L280,36.2" fill="none" stroke="#f0c25a" stroke-width="1" opacity=".75"/><path d="M40,36.2 L50,36.4 L60,36.4 L70,36.1 L80,35.7 L90,35.1 L100,34.5 L110,33.8 L120,33.1 L130,32.5 L140,32 L150,31.7 L160,31.6 L170,31.7 L180,32 L190,32.5 L200,33.1 L210,33.7 L220,34.4 L230,35.1 L240,35.7 L250,36.1 L260,36.3 L270,36.4 L280,36.2" fill="none" stroke="#f4e6bb" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 14" class="dash" style="animation-delay:0s" opacity=".85"/><path transform="translate(130,32.5) scale(0.8333333333333334)" d="M0,-8L2,-2L8,0L2,2L0,8L-2,2L-8,0L-2,-2Z" fill="#f0c25a"/><path d="M620,32.6 L630,33.2 L640,33.9 L650,34.6 L660,35.3 L670,35.8 L680,36.2 L690,36.4 L700,36.4 L710,36.1 L720,35.7 L730,35.2 L740,34.5 L750,33.8 L760,33.2 L770,32.5 L780,32 L790,31.7 L800,31.6 L810,31.7 L820,32 L830,32.4 L840,33 L850,33.7 L860,34.4" fill="none" stroke="#f0c25a" stroke-width="1" opacity=".75"/><path d="M620,32.6 L630,33.2 L640,33.9 L650,34.6 L660,35.3 L670,35.8 L680,36.2 L690,36.4 L700,36.4 L710,36.1 L720,35.7 L730,35.2 L740,34.5 L750,33.8 L760,33.2 L770,32.5 L780,32 L790,31.7 L800,31.6 L810,31.7 L820,32 L830,32.4 L840,33 L850,33.7 L860,34.4" fill="none" stroke="#f4e6bb" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 14" class="dash" style="animation-delay:-3s" opacity=".85"/><path transform="translate(710,36.1) scale(0.8333333333333334)" d="M0,-8L2,-2L8,0L2,2L0,8L-2,2L-8,0L-2,-2Z" fill="#f0c25a"/><path d="M300,18H600L612,34L600,50H300L288,34Z" fill="#24347e" stroke="#f0c25a" stroke-width="1.6"/><text x="450" y="39" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace" font-size="13" font-weight="700" letter-spacing="3.5" fill="#f9efcf">IV  ·  SELECTED PROJECTS</text><path d="M300,60V84M600,60V84" stroke="#f0c25a" stroke-width="1.4"/><path class="flag" d="M300,60L324,66L300,72Z" fill="#ee7f5f"/><path class="flag" d="M600,60L624,66L600,72Z" fill="#ee7f5f" style="animation-delay:-1.5s"/><rect class="grain" width="900" height="90" fill="#000" opacity=".5" filter="url(#noise)"/></svg>